<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⏰ Task Reminder</h2>

        <p>Hello {{UserName}},</p>

        <p>Your task <strong>{{TaskName}}</strong> starts at <strong>{{StartTime}}</strong>.</p>

        <p>Good luck!</p>
    </div>

</body>
</html>

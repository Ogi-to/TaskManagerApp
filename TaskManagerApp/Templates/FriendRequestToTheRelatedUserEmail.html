<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Friend Request</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: Arial, Helvetica, sans-serif;">

    <div style="padding: 40px 20px;">

        <div style="
            max-width: 550px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        ">

            <!-- Header -->
            <div style="
                background-color: #007BFF;
                padding: 25px;
                text-align: center;
            ">
                <h1 style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 24px;
                ">
                    New Friend Request
                </h1>
            </div>

            <!-- Content -->
            <div style="padding: 35px 30px;">

                <p style="
                    margin-top: 0;
                    font-size: 16px;
                    color: #333333;
                ">
                    Hello <strong>{{UserName}}</strong>,
                </p>

                <p style="
                    font-size: 16px;
                    line-height: 1.6;
                    color: #555555;
                ">
                    You have received a new friend request from
                    <strong>{{InitiatorName}}</strong>.
                </p>

                <p style="
                    font-size: 16px;
                    line-height: 1.6;
                    color: #555555;
                ">
                    Log in to your account to view and respond to the request.
                </p>

                <!-- Button -->
                <div style="text-align: center; margin: 30px 0 10px 0;">

                    <a href="{{LoginUrl}}" style="
                        display: inline-block;
                        padding: 14px 28px;
                        background-color: #007BFF;
                        color: #ffffff;
                        text-decoration: none;
                        font-size: 16px;
                        font-weight: bold;
                        border-radius: 6px;
                    ">
                        Log In
                    </a>

                </div>

            </div>

            <!-- Footer -->
            <div style="
                padding: 20px;
                background-color: #f8f9fa;
                text-align: center;
                border-top: 1px solid #eeeeee;
            ">
                <p style="
                    margin: 0;
                    font-size: 12px;
                    color: #888888;
                ">
                    This is an automated message. Please do not reply to this email.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
